name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build-and-release:
    # MacPulse targets macOS 26 and uses Swift 6, so it needs an Xcode 26
    # toolchain. macos-26 is the runner that ships it (macos-14 + Xcode 15.4
    # cannot compile this project).
    runs-on: macos-26
    name: Build, Package & Publish DMG
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode toolchain
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)"
          [[ -n "$XCODE_APP" ]] && sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Verify macOS 26 SDK is available
        run: |
          set -euo pipefail
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $SDK_VERSION"
          if [[ "${SDK_VERSION%%.*}" -lt 26 ]]; then
            echo "error: MacPulse requires the macOS 26 SDK (got $SDK_VERSION)" >&2
            exit 1
          fi

      - name: Build and Package Release DMG
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/release_dmg.sh
          ./scripts/release_dmg.sh

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == "main" || -z "$TAG" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [[ -z "$TAG" ]]; then
            TAG="v1.0.0"
          fi

          DMG_FILE=$(ls MacPulse-*.dmg | head -n 1)
          SHA_FILE="${DMG_FILE}.sha256"

          # Stable-name duplicates (MacPulse.dmg / MacPulse.dmg.sha256) let the
          # landing page and install.sh use releases/latest/download/MacPulse.dmg
          # without breaking on every version bump.
          cp "$DMG_FILE" MacPulse.dmg
          awk '{print $1 "  MacPulse.dmg"}' "$SHA_FILE" > MacPulse.dmg.sha256

          echo "Publishing $DMG_FILE, $SHA_FILE and stable-name copies to GitHub Releases under $TAG..."

          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" "$DMG_FILE" "$SHA_FILE" MacPulse.dmg MacPulse.dmg.sha256 --clobber
          else
            gh release create "$TAG" "$DMG_FILE" "$SHA_FILE" MacPulse.dmg MacPulse.dmg.sha256 \
              --title "MacPulse $TAG" \
              --notes "Native macOS system cleaner and deep uninstaller for Apple Silicon and Intel Macs."
          fi
          echo "Successfully published release $TAG!"

