<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MacPulse logo</title>
  <desc id="desc">Two blue and teal circular arrows surrounding a four-point white and mint sparkle.</desc>

  <defs>
    <linearGradient id="tealArrow" x1="93" y1="270" x2="427" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#008b9e"/>
      <stop offset="0.48" stop-color="#08c9c4"/>
      <stop offset="1" stop-color="#7dffe0"/>
    </linearGradient>
    <linearGradient id="tealHighlight" x1="129" y1="213" x2="384" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a2fff0" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#d9fff8" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="blueArrow" x1="81" y1="440" x2="421" y2="221" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#003b98"/>
      <stop offset="0.5" stop-color="#0068dd"/>
      <stop offset="1" stop-color="#18c6e5"/>
    </linearGradient>
    <linearGradient id="blueShade" x1="142" y1="375" x2="391" y2="255" gradientUnits="userSpaceOnUse">
      <stop stop-color="#001f68" stop-opacity="0.92"/>
      <stop offset="0.62" stop-color="#043e9f" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#43e7ef" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sparkle" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f9fffb"/>
      <stop offset="0.78" stop-color="#a9ffe0"/>
      <stop offset="1" stop-color="#35e5bd"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#001b56" flood-opacity="0.30"/>
    </filter>
    <filter id="sparkleGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Upper clockwise arrow -->
    <path fill="url(#tealArrow)" d="M83 286c-25-111 41-219 153-246 65-16 133-2 185 37l31-32c10-10 27-3 27 11l-2 112c0 12-10 22-22 21l-111-8c-14-1-20-18-10-28l34-35c-35-23-78-30-119-20-79 19-128 98-109 177 4 18-7 36-25 40-15 4-29-4-32-29z"/>
    <path fill="url(#tealHighlight)" d="M106 258c-5-77 44-151 121-178 62-22 130-9 179 29l-19 20c-42-30-97-39-147-21-63 22-104 81-104 146 0 11-8 21-19 23-6 1-10-5-11-19z"/>

    <!-- Lower counterbalancing arrow -->
    <path fill="url(#blueArrow)" d="M429 226c25 111-41 219-153 246-65 16-133 2-185-37l-31 32c-10 10-27 3-27-11l2-112c0-12 10-22 22-21l111 8c14 1 20 18 10 28l-34 35c35 23 78 30 119 20 79-19 128-98 109-177-4-18 7-36 25-40 15-4 29 4 32 29z"/>
    <path fill="url(#blueShade)" d="M383 248c8 72-37 142-108 166-52 18-108 8-151-24l31-32c31 18 70 23 106 11 58-20 95-76 91-136 11-8 25-13 37-10-7 6-8 15-6 25z"/>
    <path fill="none" stroke="#7af6ff" stroke-opacity="0.72" stroke-width="9" stroke-linecap="round" d="M391 266c-8 56-46 104-100 123"/>
  </g>

  <!-- Central pulse sparkle -->
  <path fill="#55f0c7" opacity="0.24" filter="url(#sparkleGlow)" d="M256 158c12 55 30 73 85 85-55 12-73 30-85 85-12-55-30-73-85-85 55-12 73-30 85-85z"/>
  <path fill="url(#sparkle)" stroke="#baffea" stroke-width="3" d="M256 157c12 56 31 75 87 87-56 12-75 31-87 87-12-56-31-75-87-87 56-12 75-31 87-87z"/>
  <circle cx="256" cy="244" r="10" fill="#ffffff"/>
</svg>
